<!doctype html>
<html lang="fr" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pleino — Localisation, Réservation & Paiement de Carburant au Togo</title>
    <meta name="description" content="Trouvez une station avec du carburant en stock près de vous, réservez vos litres et payez par mobile money (TMoney, Flooz). Lomé et tout le Togo." />
    <meta name="theme-color" content="#00553c" />
    <script>
      // The site is light by default (easy to read in the sun). Dark theme chosen on this phone:
      // apply it before the page draws.
      try {
        if (JSON.parse(localStorage.getItem('ronikov.theme')) === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pleino" />

    <!-- Preview when the link is shared (WhatsApp, Facebook, X...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pleino" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://ronikov.onrender.com/" />
    <meta property="og:title" content="Pleino — Ne faites plus jamais la queue pour votre carburant" />
    <meta property="og:description" content="Stocks en direct des stations du Togo, réservation de carburant et paiement mobile." />
    <meta property="og:image" content="https://ronikov.onrender.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="h-full bg-black text-white selection:bg-amber-400 selection:text-black font-sans">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Makes the site installable on phones ("Ajouter à l'écran d'accueil").
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
      }
    </script>
  </body>
</html>
