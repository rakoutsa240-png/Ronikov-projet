# Builds the Android app. Every run leaves, under "Artifacts" on its page:
# - ronikov-test.apk: install it directly on an Android phone to try the app;
# - ronikov-play-store.aab: the file to upload to the Play Store, signed only once the
#   ANDROID_KEYSTORE_* secrets exist (see README, "Application Android").
# The app shows the live site, so ordinary site changes need no new build.
name: Appli Android

on:
  pull_request:
    paths: ['android/**', 'capacitor.config.ts', 'package.json', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'capacitor.config.ts', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer
        run: bun install --frozen-lockfile
      - name: Préparer le projet Android
        run: |
          npm run build
          npx cap sync android
      - name: Clé de signature Play Store
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Compiler
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug bundleRelease --no-daemon
      - name: Renommer
        run: |
          mkdir -p sortie
          cp android/app/build/outputs/apk/debug/app-debug.apk sortie/ronikov-test.apk
          cp android/app/build/outputs/bundle/release/app-release.aab sortie/ronikov-play-store.aab
      - uses: actions/upload-artifact@v4
        with:
          name: ronikov-test.apk
          path: sortie/ronikov-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ronikov-play-store.aab
          path: sortie/ronikov-play-store.aab
