# Checks every change before it reaches main (and the live site): types, tests and build.
name: Vérification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer
        run: bun install --frozen-lockfile
      - name: Types
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
